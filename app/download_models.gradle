task downloadModelFile0(type: Download) {
    src 'https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite0/float32/1/efficientdet_lite0.tflite'
    dest project.ext.ASSET_DIR + '/efficientdet-lite0.tflite'
    overwrite false
}

task downloadModelFile1(type: Download) {
    src 'https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite2/float32/1/efficientdet_lite2.tflite'
    dest project.ext.ASSET_DIR + '/efficientdet-lite2.tflite'
    overwrite false
}

// FaceNet-512 from shubham0204/FaceRecognition_With_FaceNet_Android (Apache-2.0).
task downloadModelFile2(type: Download) {
    src 'https://raw.githubusercontent.com/shubham0204/FaceRecognition_With_FaceNet_Android/master/app/src/main/assets/facenet_512.tflite'
    dest project.ext.ASSET_DIR + '/facenet_512.tflite'
    overwrite false
}

// MediaPipe interactive segmenter (MagicTouch v2) for object outlines.
task downloadModelFile3(type: Download) {
    src 'https://storage.googleapis.com/mediapipe-models/interactive_segmenter_v2/magic_touch/int8/1/interactive_segmentation.task'
    dest project.ext.ASSET_DIR + '/interactive_segmentation.task'
    overwrite false
}

// MediaPipe image embedder for saved cars and objects.
task downloadModelFile4(type: Download) {
    src 'https://storage.googleapis.com/mediapipe-models/image_embedder/mobilenet_v3_small/float32/1/mobilenet_v3_small.tflite'
    dest project.ext.ASSET_DIR + '/mobilenet_v3_small.tflite'
    overwrite false
}

preBuild.dependsOn downloadModelFile0, downloadModelFile1, downloadModelFile2, downloadModelFile3, downloadModelFile4
